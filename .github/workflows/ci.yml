name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:run

      # Fails the build if any design token pairing drops below WCAG AA, or if
      # two status colours become indistinguishable under simulated colour
      # vision deficiency. Cheap to run and the only automated guard on the
      # palette — a contrast regression is otherwise invisible in review.
      - name: Contrast and colour vision check
        run: pnpm check:contrast

      - name: Build
        run: pnpm build

      # Runs after the build because it measures the real production server:
      # it starts `next start` on a free port and sums the scripts the home
      # page's HTML actually declares. Summing .next/static would be easier and
      # wrong — that total counts lazily-loaded chunks nobody fetches on first
      # paint.
      - name: Bundle size budget
        run: pnpm check:bundle
